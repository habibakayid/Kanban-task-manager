<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Task Manager</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <header class="app-header">
      <div class="header-left">
        <span class="header-icon"><i class="fa-solid fa-table-columns"></i></span>
        <h1>Kanban</h1>
      </div>
      <button type="button" class="btn-add-task" id="addTaskBtn" aria-label="Add task">
        <i class="fa-solid fa-plus"></i>
      </button>
    </header>

    <main class="board">
      <!-- To Do -->
      <section class="column" data-column="todo">
        <div class="column-header">
          <div class="column-icon icon-todo"><i class="fa-solid fa-clipboard-list"></i></div>
          <div class="column-heading">
            <h2>To Do</h2>
            <span class="column-count" data-count="todo">0 tasks</span>
          </div>
        </div>
        <div class="column-body"></div>
      </section>

      <section class="column" data-column="in-progress">
        <div class="column-header">
          <div class="column-icon icon-in-progress"><i class="fa-solid fa-spinner"></i></div>
          <div class="column-heading">
            <h2>In Progress</h2>
            <span class="column-count" data-count="in-progress">0 tasks</span>
          </div>
        </div>
        <div class="column-body"></div>
      </section>

      <!-- Completed -->
      <section class="column" data-column="done">
        <div class="column-header">
          <div class="column-icon icon-done"><i class="fa-solid fa-circle-check"></i></div>
          <div class="column-heading">
            <h2>Completed</h2>
            <span class="column-count" data-count="done">0 tasks</span>
          </div>
        </div>
        <div class="column-body"></div>
      </section>
    </main>

    <footer class="app-footer">
      Made with <i class="fa-solid fa-heart"></i> by Habiba Kayid
    </footer>

    <div class="modal-overlay" id="taskModal">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="modalTitle">Add New Task</h3>
          <button type="button" class="modal-close" id="closeModalBtn" aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <form id="taskForm" class="modal-form">
          <div class="form-group">
            <label for="taskTitle">Task Title <span class="required-mark">*</span></label>
            <input type="text" id="taskTitle" maxlength="80" required placeholder="Task title" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="taskPriority">Priority</label>
              <select id="taskPriority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>

            <div class="form-group">
              <label for="taskDueDate">Due Date</label>
              <input type="date" id="taskDueDate" />
            </div>
          </div>

          <div class="form-group">
            <label for="taskStatus">Status</label>
            <select id="taskStatus">
              <option value="todo">To Do</option>
              <option value="in-progress">In Progress</option>
              <option value="done">Completed</option>
            </select>
          </div>

          <div class="form-group">
            <label for="taskDescription">Description</label>
            <textarea
              id="taskDescription"
              rows="3"
              maxlength="500"
              placeholder="Optional details..."
            ></textarea>
            <span class="char-counter" id="descCounter">0/500</span>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
            <button type="submit" class="btn-primary" id="submitBtn">Add Task</button>
          </div>
        </form>
      </div>
    </div>

    <script src="./dist/app.js" type="module"></script>
  </body>
</html>
